# KataHex Configuration for Tournament Play
# Optimized for 11x11 Hex, 8 CPUs, 8GB RAM, 5-minute game limit

# Number of search threads - adjust based on CPU count
numSearchThreads = 6

# Maximum visits per move (controls thinking depth)
# With 6 threads on CSF3: 100 visits ≈ 5-6 seconds per move
# 5-minute game = 300 seconds / ~50 moves = 6 seconds per move
maxVisits = 100

# Time limit per move (seconds) - safety buffer
maxTime = 8

# Time management
# Conservative time usage to ensure we don't timeout
maxTimePondering = 0
lagBuffer = 2.0

# Disable pondering (thinking on opponent's time)
ponderingEnabled = false

# Resignation threshold - disable to play out all games
resignThreshold = -0.99
allowResignation = false

# Root temperature - 0 for deterministic play
chosenMoveTemperature = 0.0
chosenMoveTemperatureEarly = 0.0

# Conservative MCTS parameters
cpuctExploration = 1.0
cpuctExplorationLog = 0.45

# Memory usage - stay within 8GB limit
maxPlayouts = 100000

# Logging - minimal for tournament
logSearchInfo = false
logMoves = false
logGamesEvery = 0
logToStderr = false
logAllGTPCommunication = false
logFile = /dev/null

# Analysis features - disable for speed
reportAnalysisWinratesAs = BLACK

# Root noise - disable for consistent play
rootNoiseEnabled = false
